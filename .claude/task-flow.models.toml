# task-flow model configuration for THIS repository (project file).
# It is merged over the user file ~/.claude/task-flow/models.toml: a key set here wins,
# keys not set here come from the user file. No secrets: api_key_env is the NAME of an
# environment variable. Prices are USD per 1M tokens (docs.mistral.ai/inference/pricing,
# checked 2026-10-31). max_cost_usd is cumulative over one implement.py run, including
# every profile of the fallback chain.

[profiles.mistral-large]
driver = "openai-loop"
base_url = "https://api.mistral.ai/v1"
model = "mistral-large-4-0"
api_key_env = "MISTRAL_API_KEY"
billing = "api"
max_turns = 150
max_cost_usd = 2.00
price_input_per_mtok = 0.70
price_cached_input_per_mtok = 0.07
price_output_per_mtok = 2.10
fallback = ["mistral-small"]

[profiles.mistral-small]
driver = "openai-loop"
base_url = "https://api.mistral.ai/v1"
model = "mistral-small-2603"
api_key_env = "MISTRAL_API_KEY"
billing = "api"
max_turns = 150
max_cost_usd = 2.00
price_input_per_mtok = 0.15
price_cached_input_per_mtok = 0.015
price_output_per_mtok = 0.60

[profiles.glm-flash]
driver = "openai-loop"
base_url = "https://api.mistral.ai/v1"
model = "zai-glm-5-3-flash"
api_key_env = "MISTRAL_API_KEY"
billing = "api"
max_turns = 150
max_cost_usd = 2.00
price_input_per_mtok = 0.15
price_cached_input_per_mtok = 0.03
price_output_per_mtok = 0.50

[profiles.deepseek-flash]
driver = "openai-loop"
base_url = "https://api.mistral.ai/v1"
model = "deepseek-v4-1-flash-1017"
api_key_env = "MISTRAL_API_KEY"
billing = "api"
max_turns = 150
max_cost_usd = 2.00
price_input_per_mtok = 0.30
price_cached_input_per_mtok = 0.007
price_output_per_mtok = 1.20
fallback = ["mistral-large"]

# Codex through the CLI on the ChatGPT login (codex login). The reasoning effort comes from
# ~/.codex/config.toml. gpt-5.2-codex is not available on a ChatGPT account.
[profiles.codex]
driver = "cli"
model = "gpt-6.1-sol"
billing = "subscription"
command = ["codex", "exec", "--sandbox", "workspace-write", "--json", "--ephemeral", "-m", "gpt-6.1-sol", "-"]
read_only_command = ["codex", "exec", "--sandbox", "read-only", "--json", "--ephemeral", "-m", "gpt-6.1-sol", "-o", "{last_message_file}", "-"]
usage_format = "codex-jsonl"
timeout_seconds = 1800

# Per-role Codex profiles (models from ~/.codex/models_cache.json, checked 2026-11-11).
# gpt-6-astra: "Frontier intelligence for the most demanding work" (272k context) for the
# reviewer; gpt-6.1-sol: "Latest workhorse model for coding" (500k context) for the planner
# and implementer; gpt-6-luna for the cheap backlog role. The reasoning effort is set per
# profile with `-c model_reasoning_effort=<effort>`; models.py allows that one key (and
# no other -c/--config override) even in a read-only command.
#
#   role         profile                  model         effort
#   backlog      codex-backlog            gpt-6-luna    low
#   planner      codex-plan               gpt-6-astra   medium (static: one profile per role)
#   implementer  codex-impl / -impl-high  gpt-6.1-sol   medium, high for large plans (bands)
#   reviewer     codex-review             gpt-6-astra   medium
#   checker      script

[profiles.codex-plan]
driver = "cli"
model = "gpt-6-astra"
billing = "subscription"
command = ["codex", "exec", "-c", "model_reasoning_effort=medium", "--sandbox", "workspace-write", "--json", "--ephemeral", "-m", "gpt-6-astra", "-"]
read_only_command = ["codex", "exec", "-c", "model_reasoning_effort=medium", "--sandbox", "read-only", "--json", "--ephemeral", "-m", "gpt-6-astra", "-o", "{last_message_file}", "-"]
usage_format = "codex-jsonl"
timeout_seconds = 1800

[profiles.codex-impl]
driver = "cli"
model = "gpt-6.1-sol"
billing = "subscription"
command = ["codex", "exec", "-c", "model_reasoning_effort=medium", "--sandbox", "workspace-write", "--json", "--ephemeral", "-m", "gpt-6.1-sol", "-"]
read_only_command = ["codex", "exec", "-c", "model_reasoning_effort=medium", "--sandbox", "read-only", "--json", "--ephemeral", "-m", "gpt-6.1-sol", "-o", "{last_message_file}", "-"]
usage_format = "codex-jsonl"
# unattended-isolation round 1 ran the full 1800 s and was killed during its own
# verification run; a large round needs more time.
timeout_seconds = 3600

[profiles.codex-impl-high]
driver = "cli"
model = "gpt-6.1-sol"
billing = "subscription"
command = ["codex", "exec", "-c", "model_reasoning_effort=high", "--sandbox", "workspace-write", "--json", "--ephemeral", "-m", "gpt-6.1-sol", "-"]
read_only_command = ["codex", "exec", "-c", "model_reasoning_effort=high", "--sandbox", "read-only", "--json", "--ephemeral", "-m", "gpt-6.1-sol", "-o", "{last_message_file}", "-"]
usage_format = "codex-jsonl"
timeout_seconds = 3600

[profiles.codex-review]
driver = "cli"
model = "gpt-6-astra"
billing = "subscription"
command = ["codex", "exec", "-c", "model_reasoning_effort=medium", "--sandbox", "workspace-write", "--json", "--ephemeral", "-m", "gpt-6-astra", "-"]
read_only_command = ["codex", "exec", "-c", "model_reasoning_effort=medium", "--sandbox", "read-only", "--json", "--ephemeral", "-m", "gpt-6-astra", "-o", "{last_message_file}", "-"]
usage_format = "codex-jsonl"
timeout_seconds = 1800

[profiles.codex-backlog]
driver = "cli"
model = "gpt-6-luna"
billing = "subscription"
command = ["codex", "exec", "-c", "model_reasoning_effort=low", "--sandbox", "workspace-write", "--json", "--ephemeral", "-m", "gpt-6-luna", "-"]
read_only_command = ["codex", "exec", "-c", "model_reasoning_effort=low", "--sandbox", "read-only", "--json", "--ephemeral", "-m", "gpt-6-luna", "-o", "{last_message_file}", "-"]
usage_format = "codex-jsonl"
timeout_seconds = 1800

[roles]
# Claude subagents in the session (subscription) since 2026-11-20; the Codex profiles
# above stay defined. To switch back: planner = "codex-plan", reviewer = "codex-review"
# and the [roles.implementer] band table below instead of the implementer scalar.
planner = "claude:opus"
implementer = "claude:sonnet"
backlog = "codex-backlog"
checker = "script"
reviewer = "claude:opus"

# Codex implementer routing, disabled while the implementer is a Claude subagent (a
# scalar and the table form cannot both be set). Effort follows the size of the approved
# plan: S and M use medium, L (overflow) uses high. Bounds are inclusive and count the
# plan's Steps, AC labels, verification commands and declared paths.
# [roles.implementer]
# default = "codex-impl"
#
# [roles.implementer.bands]
# S = "codex-impl"
# M = "codex-impl"
# L = "codex-impl-high"
#
# [roles.implementer.thresholds.S]
# steps = 3
# criteria = 3
# commands = 3
# declared_paths = 4
#
# [roles.implementer.thresholds.M]
# steps = 6
# criteria = 6
# commands = 6
# declared_paths = 10

# Keep a generous timeout for each check while running independent checks concurrently.
[gates]
command_timeout_seconds = 2400
workers = 4

