# Model configuration for Codex sessions in agent-workbench.
[profiles.codex-plan]
driver = "cli"
model = "gpt-6-astra"
billing = "subscription"
command = ["codex", "exec", "-m", "gpt-6-astra", "--sandbox", "workspace-write", "--json", "--ephemeral", "-"]
read_only_command = ["codex", "exec", "-m", "gpt-6-astra", "--sandbox", "read-only", "--json", "--ephemeral", "-o", "{last_message_file}", "-"]
usage_format = "codex-jsonl"
timeout_seconds = 1800

[profiles.codex-impl]
driver = "cli"
model = "gpt-6.1-sol"
billing = "subscription"
command = ["codex", "exec", "-m", "gpt-6.1-sol", "--sandbox", "workspace-write", "--json", "--ephemeral", "-"]
usage_format = "codex-jsonl"
timeout_seconds = 1800

[roles]
planner = "codex-plan"
implementer = "codex-impl"
reviewer = "codex-plan"
backlog = "codex-plan"
checker = "script"

[gates]
workers = 4
command_timeout_seconds = 2400
